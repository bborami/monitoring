<style>
/* Layout: sticky search/tab bar over a 3-column tile grid; detail opens as a bottom sheet with per-block copy */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8eae6; --line:#d9dcd6;
  --fg:#1c211f; --muted:#5f6862; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dde9f2;
  --notice:#faf7ff; --notice-line:#e4d9fb; --info:#a689ea; --ok:#2f7a4f; --star:#d29a0c; --plate:#ffffff; --heart:#e5243b; --must:#7b3fe4; --must-bg:#f3edff; --must-line:#cbb5f7; --must-ink:#4b1fa3;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1c2220; --sunk:#252c29; --line:#323a36;

  --notice:#1f1b2a; --notice-line:#3b3156; --info:#8a70d0; --ok:#6fc597; --star:#f0c24b; --plate:#f4f5f3; --heart:#ff4d61; --must:#9b6dff; --must-bg:#251c3a; --must-line:#4a3878; --must-ink:#d8c6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1c2220; --sunk:#252c29; --line:#323a36;
  --fg:#e7ebe8; --muted:#9aa49e; --accent:#7db8e3; --accent-ink:#0e1a22; --accent-soft:#1f3343;
  --notice:#1f1b2a; --notice-line:#3b3156; --info:#8a70d0; --ok:#6fc597; --star:#f0c24b; --plate:#f4f5f3; --heart:#ff4d61; --must:#9b6dff; --must-bg:#251c3a; --must-line:#4a3878; --must-ink:#d8c6ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;padding-block:6px 14px}
header.top h1,header.top .upd{grid-column:1}
header.top h1{font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.01em}
header.top .upd{margin:0;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
header.top .upd b{color:var(--must);font-weight:700}

/* notices */
.notices{display:grid;gap:8px}
.notice{background:var(--notice);border:1px solid var(--notice-line);border-radius:var(--r);overflow:hidden}
.notice > .row{display:flex;gap:10px;align-items:center;padding:12px 14px}
.notice.static .ttl{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
.notice > button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.notice .tag{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--fg);color:var(--bg)}
.notice .tag.lite{background:var(--info);color:#fff}
header.top h1,.sheet .hd h2,.contact h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.tab,.copyall,.notice .tag{font-family:var(--font-display);font-weight:600}
.tab[aria-selected="true"]{font-weight:800}
.copyall{font-weight:800}
.notice.must{background:var(--must-bg);border-color:var(--must-line)}
.notice.must .tag{background:var(--must);color:#fff}
.notice.must .ttl{color:var(--must-ink)}
.notice .ttl{flex:1;min-width:0;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice .chev{flex:none;transition:transform .2s;color:var(--muted)}
.notice[aria-expanded="true"] .chev{transform:rotate(180deg)}
.notice[aria-expanded="true"] .ttl{white-space:normal}
.notice .body{padding:0 14px 14px;font-size:.88rem;color:var(--fg)}
.notice .body p{margin:0 0 6px}
.notice .body .date{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* sticky controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;height:46px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);height:100%;outline:none}
.search input::placeholder{color:var(--muted)}
.search .clear{border:0;background:var(--sunk);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .n{margin-left:4px;font-size:.75rem;opacity:.65;font-variant-numeric:tabular-nums}

/* grid */
.meta{font-size:.8rem;color:var(--muted);margin:4px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:340px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{border:1px solid var(--line);background:var(--plate);border-radius:var(--r);padding:12%;aspect-ratio:1;max-width:100%;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0;transition:transform .12s,border-color .12s}
.card{position:relative}
.card:active{transform:scale(.97)}
.cell{position:relative;min-width:0}
.cell .card{width:100%}
.heart{position:absolute;top:3px;right:3px;width:26px;height:26px;border:0;background:transparent;display:grid;place-items:center;color:#9aa19c;border-radius:50%}
.heart svg{width:15px;height:15px}
.heart[aria-pressed="true"]{color:var(--heart)}
.heart[aria-pressed="true"] svg{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.3)}}
.star-btn{color:var(--muted)}
.star-btn[aria-pressed="true"]{color:var(--heart)}
.card:hover{border-color:var(--accent)}
.mono{width:52px;height:52px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--plate);border:1px solid var(--line);padding:6px}
.mono img,.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo{position:absolute;inset:29% 12% 11% 12%;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.logo img{width:auto;height:auto}
.card .nm{font-size:.82rem;font-weight:600;line-height:1.3;word-break:keep-all;min-height:2.6em;display:flex;align-items:center}
.card .ct{font-size:.7rem;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--muted);font-size:.9rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .hd h2{margin:0;font-size:1.1rem;flex:1;min-width:0}
.sheet .hd .sub{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.icon-btn{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.sheet .bd{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:.7rem;padding:2px 7px;font-family:var(--font-body)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.block .bh{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
.block .bh strong{flex:1;font-size:.88rem}
.block .kind{font-size:.68rem;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.copy{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.copy.done{background:var(--ok)}
.block pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--font-body);font-size:.88rem;line-height:1.65;user-select:text}
mark{background:var(--notice-line);color:inherit;border-radius:3px;padding:0 1px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.contact h3{margin:0;font-size:1.05rem}
.contact .hint{margin:4px 0 8px;font-size:.78rem;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.rows li:last-child{border-bottom:0}
.lbl{font-weight:600;font-size:.9rem}
.lbl small{font-weight:400;color:var(--muted);font-size:.75rem}
.val{display:flex;align-items:center;gap:10px;justify-content:space-between}
.val a{min-width:0;color:var(--accent);font-weight:600}
.val .tel{display:inline-flex;align-items:center;gap:6px;font-size:1.2rem;font-variant-numeric:tabular-nums}
.val .tel svg{flex:none}
.val .url{font-size:.82rem;overflow-wrap:anywhere;line-height:1.4}
.val .none{color:var(--muted);font-size:.85rem}
.val .mini{flex:none;padding:6px 10px;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--surface)}
.val .mini.done{color:var(--ok);border-color:var(--ok)}
.copyall{width:100%;margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center}
.copyall:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:30;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.visits{margin:28px 0 0;text-align:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.visits b{color:var(--fg);font-weight:600;margin-left:3px}
.foot{margin-top:24px;font-size:.75rem;color:var(--muted);text-align:center}

/* tablet & PC */
@media (min-width:640px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
}
@media (min-width:768px){
  .wrap{max-width:960px;padding-block:28px 64px}
  header.top h1{font-size:1.6rem}
  header.top .upd{font-size:.85rem}
  .controls{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .controls .search{order:2;width:300px}
  .notices{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .notice.must{grid-row:1 / span 2}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
  .heart{top:6px;right:6px}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:480px;max-height:80vh;border-radius:18px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s,opacity .2s;margin:0}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet .grab{display:none}
}
@media (min-width:1100px){
  .wrap{max-width:1080px}
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

        $("#vTotal").textContent = await get(url(p));

      }catch(e){}
    }
  },1500);
})();
